version: '3.8'

volumes:
  pifpaf-test-data:

networks:
  pifpaf-test-net:
    internal: true

services:
  db-init-test:
    build:
      context: ./arena-dashboard/scraper
      dockerfile: Dockerfile
    container_name: arena-db-init-test
    command: ["python", "/app/migrate_db.py", "--database", "/data/app.db"]
    volumes:
      - pifpaf-test-data:/data
    networks:
      - pifpaf-test-net

  scraper-test:
    build:
      context: ./arena-dashboard/scraper
      dockerfile: Dockerfile
    container_name: arena-scraper-test
    restart: "no"
    volumes:
      - pifpaf-test-data:/data
    environment:
      - DATABASE_PATH=/data/app.db
      - SCRAPE_INTERVAL_MINUTES=1440
      - NTFY_URL=
      - ALERT_ON_FIRST_RUN=false
    networks:
      - pifpaf-test-net
    depends_on:
      db-init-test:
        condition: service_completed_successfully

  web-test:
    build:
      context: ./arena-dashboard/web
      dockerfile: Dockerfile
    container_name: arena-web-test
    restart: "no"
    ports:
      - "8099:3000/tcp"
    volumes:
      - pifpaf-test-data:/data
    environment:
      - DATABASE_PATH=/data/app.db
      - HOSTNAME=0.0.0.0
      - ADMIN_SETUP_TOKEN=test-only-setup-token
    networks:
      - pifpaf-test-net
    depends_on:
      db-init-test:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
